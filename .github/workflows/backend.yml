name: Backend - Test, Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/klarfinance/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/klarfinance/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/hikeean/klarfinance-backend

defaults:
  run:
    working-directory: backend/klarfinance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn test
        run: ./mvnw -B test
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_SSL_ENABLED: ${{ secrets.REDIS_SSL_ENABLED }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_TIMEOUT: ${{ secrets.REDIS_TIMEOUT }}
          REDIS_KEY_PREFIX: ${{ secrets.REDIS_KEY_PREFIX }}
          LOCATION_FAILURE_LOG_REDIS_URL: ${{ secrets.LOCATION_FAILURE_LOG_REDIS_URL }}

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn package (skip tests, already ran in test job)
        run: ./mvnw -B -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend/klarfinance
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keeps the server's compose file in sync with what's committed here.
      # Real secrets (DB, JWT, etc.) stay in the server's own .env - never scp'd, never in repo.
      - name: Upload docker-compose.yaml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "backend/klarfinance/docker-compose.yaml"
          target: "~/klarfinance-backend"
          strip_components: 2

      - name: Pull & restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/klarfinance-backend
            # Only needed while the ghcr.io package is private - skip this login step
            # once you've made ghcr.io/hikeean/klarfinance-backend public.
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f
