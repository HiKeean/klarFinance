name: Backend - Test, Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/klarfinance/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/klarfinance/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/hikeean/klarfinance-backend

defaults:
  run:
    working-directory: backend/klarfinance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn test
        run: ./mvnw -B test
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_SSL_ENABLED: ${{ secrets.REDIS_SSL_ENABLED }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_TIMEOUT: ${{ secrets.REDIS_TIMEOUT }}
          REDIS_KEY_PREFIX: ${{ secrets.REDIS_KEY_PREFIX }}
          LOCATION_FAILURE_LOG_REDIS_URL: ${{ secrets.LOCATION_FAILURE_LOG_REDIS_URL }}

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn package (skip tests, already ran in test job)
        run: ./mvnw -B -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend/klarfinance
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keeps the server's compose file in sync with what's committed here.
      # Real secrets (DB, JWT, etc.) stay in the server's own .env - never scp'd, never in repo.
      - name: Upload docker-compose.yaml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "backend/klarfinance/docker-compose.yaml"
          target: "~/klarfinance-backend"
          strip_components: 2

      - name: Pull & restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/klarfinance-backend

            # .env di-generate tiap deploy dari GitHub Secrets - source of truth ada di GitHub,
            # bukan lagi di file lokal server. Update secret di GitHub, deploy berikutnya otomatis sinkron.
            cat > .env <<EOF
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_SSL_ENABLED=${{ secrets.REDIS_SSL_ENABLED }}
            REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_TIMEOUT=${{ secrets.REDIS_TIMEOUT }}
            REDIS_KEY_PREFIX=${{ secrets.REDIS_KEY_PREFIX }}
            LOCATION_FAILURE_LOG_REDIS_URL=${{ secrets.LOCATION_FAILURE_LOG_REDIS_URL }}
            KIRIMI_URL=${{ secrets.KIRIMI_URL }}
            KIRIMI_USER_CODE=${{ secrets.KIRIMI_USER_CODE }}
            KIRIMI_SECRET=${{ secrets.KIRIMI_SECRET }}
            KIRIMI_DEVICE_ID=${{ secrets.KIRIMI_DEVICE_ID }}
            KIRIMI_ENABLED=${{ secrets.KIRIMI_ENABLED }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            EOF
            chmod 600 .env

            # Firebase service account (FCM push notification) - JSON file disimpan base64 di
            # GitHub Secret karena env var .env gak cocok buat multi-line JSON. Di-mount ke container
            # lewat docker-compose.yaml volume, path-nya di-set lewat FIREBASE_SERVICE_ACCOUNT_PATH.
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > firebase-service-account.json
            chmod 600 firebase-service-account.json

            # Only needed while the ghcr.io package is private - skip this login step
            # once you've made ghcr.io/hikeean/klarfinance-backend public.
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f
