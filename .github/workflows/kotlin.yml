name: Kotlin - Test & Build Release

on:
  push:
    branches: [main]
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: kotlin

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: kotlin/app/build/reports/tests/
          retention-days: 7

  build-release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Reuses this project's existing envProp()/.env convention (see build.gradle.kts
      # and .env.example) instead of wiring a separate secrets path just for CI.
      - name: Write kotlin/.env from secrets
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          API_KEY: ${{ secrets.APP_API_KEY }}
          SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          CLIENT_TYPE: ANDROID
        run: |
          cat > .env <<EOF
          BASE_URL=${BASE_URL}
          API_KEY=${API_KEY}
          SECRET_KEY=${SECRET_KEY}
          CLIENT_TYPE=${CLIENT_TYPE}
          EOF

      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "RELEASE_KEYSTORE_PATH=$(pwd)/release.jks"
            echo "RELEASE_KEYSTORE_PASSWORD=${RELEASE_KEYSTORE_PASSWORD}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
          } >> .env

      - name: Build AAB + APK
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: klarfinance-release-aab
          path: kotlin/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: klarfinance-release-apk
          path: kotlin/app/build/outputs/apk/release/*.apk
          retention-days: 30
