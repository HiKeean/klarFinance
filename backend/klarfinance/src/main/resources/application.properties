spring.application.name=SSO-JWT

spring.config.import=optional:file:.env.dev[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.implicit-strategy=com.api.klarfinance.global.CustomImplicitNamingStrategy

spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# Needed once a module introduces a genuinely NEW schema (geo, for location routine tracking) -
# every schema before this (auth/dbo/fin/los) already existed in the dev DB, so ddl-auto=update
# only ever had to create tables within them. Hibernate does NOT auto-CREATE SCHEMA on its own
# unless this is set. Both properties set deliberately - the JPA-standard one alone was NOT
# enough to make ddl-auto=update (SchemaMigrator, not SchemaCreator) actually emit CREATE SCHEMA;
# the native hibernate.hbm2ddl.create_namespaces is the one that's actually respected there.
spring.jpa.properties.jakarta.persistence.schema-generation.create-database-schemas=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:8081}
app.redis.key-prefix=${REDIS_KEY_PREFIX}
app.redis.host=${REDIS_HOST}
app.redis.port=${REDIS_PORT}
app.redis.ssl-enabled=${REDIS_SSL_ENABLED:false}
app.redis.username=${REDIS_USERNAME}
app.redis.password=${REDIS_PASSWORD}
app.redis.timeout=${REDIS_TIMEOUT}
app.redis.lettuce-pool-max-active=100
app.redis.lettuce-pool-max-wait=1ms
app.redis.lettuce-pool-max-idle=50
app.redis.lettuce-pool-min-idle=10

# Separate Redis instance, only for "location not sended" failure telemetry - see
# LocationFailureLogRedisConfig/LocationFailureLogService. Deliberately independent from
# app.redis.* above (different credential/instance provided specifically for this purpose).
app.location-failure-log.redis-url=${LOCATION_FAILURE_LOG_REDIS_URL}

# Redis backing Spring @Cacheable (see CacheConfig) - the SECOND instance, not app.redis.* (OTP/session state).
# Defaults to the same instance as location-failure telemetry; set CACHE_REDIS_URL to split them later.
app.cache.redis-url=${CACHE_REDIS_URL:${LOCATION_FAILURE_LOG_REDIS_URL}}

app.kirimi.url=${KIRIMI_URL:https://api.kirimi.id/v1/send-message}
app.kirimi.user-code=${KIRIMI_USER_CODE:KMYP2N0826}
app.kirimi.secret=${KIRIMI_SECRET:ee00c291410e4a7ace23365b1b64c7b8ace86207f66cf94ae965af901c1fb3cc}
app.kirimi.device-id=${KIRIMI_DEVICE_ID:D-13IW9}
app.kirimi.enabled=${KIRIMI_ENABLED:true}

# Push notification (FCM) approve/reject pengajuan ke nasabah - service account JSON dari
# Firebase Console (Project Settings > Service accounts > Generate new private key), taruh di
# root backend/klarfinance/ (JANGAN di-commit, sudah di-.gitignore) dan set path-nya di
# .env.dev. Kalau file-nya belum ada, FirebaseConfig skip inisialisasi (log warning) daripada
# gagal start - biar dev yang belum sempat setup Firebase tetap bisa jalanin backend normal.
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

# Default is 1MB/file, 10MB/request - too small for KTP+selfie uploads from a phone
# camera/gallery. Kotlin app compresses each image to <=10MB before sending (see
# core/util/ImageCompressor.kt), so cap per-file at that and leave headroom in the
# request total for two files + form fields.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

server.port=8080
